<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oodd Oodd Cooking</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="start-screen" class="screen start-screen">
      <div class="title-card">
        <p class="eyebrow">A tiny kitchen adventure</p>
        <h1>Oodd Oodd Cooking</h1>
        <p class="intro">Explore the kitchen and interact with every object before time runs out.</p>
        <button id="play-button" class="button" type="button">Play Game</button>
      </div>
    </main>

    <main id="game-screen" class="screen game-screen" hidden>
      <header class="hud">
        <div>
          <p class="eyebrow">Kitchen shift</p>
          <h2>Oodd Oodd Cooking</h2>
        </div>
        <div class="hud-stats">
          <div><span>Time</span><strong id="timer">30</strong></div>
          <div><span>Score</span><strong id="score">0</strong></div>
        </div>
      </header>

      <section class="game-shell" aria-label="Top-down kitchen game">
        <svg id="game-world" viewBox="0 0 1000 620" role="img" aria-label="Top-down kitchen with a player and three objects">
          <defs>
            <pattern id="floor-pattern" width="44" height="44" patternUnits="userSpaceOnUse">
              <rect width="44" height="44" fill="#f7f1e8" />
              <path d="M44 0H0V44" fill="none" stroke="#eadfce" stroke-width="2" />
            </pattern>
            <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#493a2c" flood-opacity=".18" />
            </filter>
          </defs>

          <rect width="1000" height="620" rx="26" fill="url(#floor-pattern)" />
          <rect x="30" y="30" width="940" height="560" rx="18" fill="none" stroke="#d7c7b2" stroke-width="3" />
          <text x="54" y="80" class="room-label">OODD OODD KITCHEN</text>

          <g class="object" data-object="table" data-x="270" data-y="220" tabindex="0">
            <rect x="190" y="155" width="160" height="130" rx="20" class="object-shadow" />
            <rect x="190" y="145" width="160" height="130" rx="20" fill="#bd764f" stroke="#8d5038" stroke-width="5" />
            <rect x="211" y="166" width="118" height="88" rx="12" fill="#d99a69" stroke="#a96343" stroke-width="4" />
            <text x="270" y="315" class="object-label">TABLE</text>
            <text x="270" y="336" class="object-score" data-label="table-score">0 interactions</text>
          </g>

          <g class="object" data-object="freezer" data-x="730" data-y="210" tabindex="0">
            <rect x="660" y="135" width="140" height="160" rx="16" class="object-shadow" />
            <rect x="660" y="125" width="140" height="160" rx="16" fill="#9bc9d1" stroke="#4d8f9d" stroke-width="5" />
            <path d="M680 202h100M730 144v38M730 220v44" stroke="#4d8f9d" stroke-width="5" stroke-linecap="round" />
            <circle cx="755" cy="163" r="7" fill="#f7f1e8" />
            <text x="730" y="325" class="object-label">FREEZER</text>
            <text x="730" y="346" class="object-score" data-label="freezer-score">0 interactions</text>
          </g>

          <g class="object" data-object="chair" data-x="490" data-y="455" tabindex="0">
            <rect x="445" y="390" width="90" height="125" rx="18" class="object-shadow" />
            <rect x="445" y="380" width="90" height="125" rx="18" fill="#e4a94f" stroke="#b87c2b" stroke-width="5" />
            <rect x="463" y="398" width="54" height="60" rx="10" fill="#f4c976" />
            <path d="M462 490v30M518 490v30" stroke="#b87c2b" stroke-width="8" stroke-linecap="round" />
            <text x="490" y="550" class="object-label">CHAIR</text>
            <text x="490" y="571" class="object-score" data-label="chair-score">0 interactions</text>
          </g>

          <g id="player" transform="translate(490 150)">
            <circle class="player-shadow" cx="0" cy="27" r="23" />
            <circle class="player-body" cx="0" cy="0" r="21" />
            <circle class="player-face" cx="0" cy="-4" r="13" />
            <circle cx="-5" cy="-6" r="2" fill="#493a2c" />
            <circle cx="5" cy="-6" r="2" fill="#493a2c" />
            <path d="M-5 2Q0 7 5 2" fill="none" stroke="#493a2c" stroke-width="2" stroke-linecap="round" />
          </g>
          <g id="interaction-prompt" transform="translate(490 105)" opacity="0">
            <rect x="-98" y="-20" width="196" height="38" rx="19" fill="#493a2c" />
            <text x="0" y="6" text-anchor="middle" class="prompt-label">PRESS E TO INTERACT</text>
          </g>
        </svg>
      </section>
      <p id="game-message" class="game-message">Use WASD or arrow keys to move.</p>
    </main>

    <script src="game.js"></script>
  </body>
</html>
